<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing... | Traffic Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 30px 20px;
    }
    h1 { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #333;
      border-top-color: #5b8af5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1a1d26;
      border: 1px solid #2e3244;
      border-radius: 14px;
      padding: 20px;
    }
    .card h2 { font-size: 1rem; color: #888; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }

    #preview-img {
      width: 100%;
      border-radius: 10px;
      background: #111;
      min-height: 300px;
      object-fit: contain;
      display: block;
    }

    .progress-bar-wrap {
      background: #2a2d3a;
      border-radius: 999px;
      height: 8px;
      margin-top: 16px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5b8af5, #7c5bf5);
      border-radius: 999px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #666;
      margin-top: 8px;
    }

    .zone-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .zone-card {
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
    }
    .zone-card .zone-name { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 6px; }
    .zone-card .zone-count { font-size: 2.6rem; font-weight: 800; line-height: 1; }

    .status-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #12171f;
      font-size: 0.88rem;
      color: #777;
    }
    .error-msg { background: #2a1010; color: #e06060; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="spinner" id="spinner"></div>
    <h1 id="page-title">Processing video...</h1>
  </div>

  <div class="layout">
    <!-- Live preview -->
    <div class="card">
      <h2>Live Preview</h2>
      <img id="preview-img" src="/static/outputs/frame.jpg" alt="Processing preview">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label">
        <span id="frame-label">Frame 0 / —</span>
        <span id="pct-label">0%</span>
      </div>
      <div class="status-msg" id="status-msg">Initializing detection pipeline...</div>
    </div>

    <!-- Live counts -->
    <div class="card">
      <h2>Waiting Counts</h2>
      <div class="zone-grid">
        <div class="zone-card" style="background:#1a2e4a;">
          <div class="zone-name" style="color:#4A90D9;">N_WAIT</div>
          <div class="zone-count" style="color:#4A90D9;" id="cnt-N_WAIT">0</div>
        </div>
        <div class="zone-card" style="background:#2e2510;">
          <div class="zone-name" style="color:#E8A838;">S_WAIT</div>
          <div class="zone-count" style="color:#E8A838;" id="cnt-S_WAIT">0</div>
        </div>
        <div class="zone-card" style="background:#112e1a;">
          <div class="zone-name" style="color:#4CAF50;">E_WAIT</div>
          <div class="zone-count" style="color:#4CAF50;" id="cnt-E_WAIT">0</div>
        </div>
        <div class="zone-card" style="background:#221535;">
          <div class="zone-name" style="color:#9C5DDB;">W_WAIT</div>
          <div class="zone-count" style="color:#9C5DDB;" id="cnt-W_WAIT">0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let redirected = false;

    function refresh() {
      // Bust cache so the preview image reloads
      const img = document.getElementById('preview-img');
      img.src = '/static/outputs/frame.jpg?t=' + Date.now();

      fetch('/status')
        .then(r => r.json())
        .then(data => {
          // Counts
          for (const [zone, val] of Object.entries(data.counts || {})) {
            const el = document.getElementById('cnt-' + zone);
            if (el) el.textContent = val;
          }

          // Progress bar
          const pct = data.progress || 0;
          document.getElementById('progress-fill').style.width = pct + '%';
          document.getElementById('pct-label').textContent = pct + '%';
          document.getElementById('frame-label').textContent =
            'Frame ' + data.frame + ' / ' + (data.total || '—');

          if (data.status === 'done' && !redirected) {
            redirected = true;
            document.getElementById('page-title').textContent = 'Done! Redirecting...';
            document.getElementById('spinner').style.display = 'none';
            setTimeout(() => window.location.href = '/results', 1200);
          } else if (data.status === 'error') {
            document.getElementById('status-msg').textContent = 'Error: ' + data.error;
            document.getElementById('status-msg').classList.add('error-msg');
            document.getElementById('spinner').style.display = 'none';
          } else {
            document.getElementById('status-msg').textContent =
              'Processing frame ' + data.frame + '...';
          }
        })
        .catch(() => {});
    }

    // Poll every second
    setInterval(refresh, 1000);
    refresh();
  </script>
</body>
</html>
